name: Pulse Dispatch Cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke pulse-dispatch edge function
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/pulse-dispatch" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "pulse-dispatch returned $STATUS" >&2
            exit 1
          fi

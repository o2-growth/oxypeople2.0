name: Pulse Dispatch Cron

# De hora em hora: a própria função decide se algum pulse está no horário.
# Concentrar a decisão nela evita ter a regra de agendamento em dois lugares.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Duas execuções simultâneas poderiam disparar o mesmo pulse duas vezes.
concurrency:
  group: pulse-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar pulses no horário
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Chave pública, não a service_role: quem autoriza de fato é o
          # CRON_SECRET abaixo. A service_role bypassa toda a RLS e não deve
          # existir fora do Supabase.
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${ANON_KEY}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Faltam secrets: SUPABASE_URL, SUPABASE_ANON_KEY ou CRON_SECRET"
            exit 1
          fi

          RESPOSTA=$(mktemp)
          STATUS=$(curl -s -o "$RESPOSTA" -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/pulse-dispatch" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            -d '{}')

          echo "HTTP $STATUS"
          # O corpo diz quantos pulses saíram e quantos foram pulados — sem
          # ele, uma falha silenciosa pareceria sucesso no log.
          cat "$RESPOSTA"
          echo

          if [ "$STATUS" != "200" ]; then
            echo "::error::pulse-dispatch respondeu $STATUS"
            exit 1
          fi

          if ! grep -q '"success":true' "$RESPOSTA"; then
            echo "::error::pulse-dispatch retornou 200 mas sem sucesso"
            exit 1
          fi

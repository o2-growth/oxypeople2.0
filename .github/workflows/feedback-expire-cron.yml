name: Feedback Expire Cron

# Agendamento desligado: a RPC expire_feedback_requests não está exposta pelo
# PostgREST, então toda execução falhava. Religar exige expor a função (GRANT
# para service_role) ou movê-la para uma edge function.
on:
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Expire overdue feedback requests
        run: |
          RESULT=$(curl -sf -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/expire_feedback_requests" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")
          echo "Expired: $RESULT requests"
